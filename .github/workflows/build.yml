# ============================================================
# NOME DO PROCESSO NO GITHUB
# Altere o texto entre aspas para o nome do seu aplicativo.
# Exemplo: "Gerar APK Meu Aplicativo"
# ATENÇÃO: isso não altera o nome abaixo do ícone do celular.
# ============================================================

name: "Gerar APK - administracasa"


# ============================================================
# QUANDO O GITHUB DEVE COMPILAR O APLICATIVO?
# Não precisa alterar.
#
# workflow_dispatch = permite iniciar a compilação manualmente.
# push = inicia uma nova compilação quando você envia alterações
# para a branch main.
# ============================================================

on:
  workflow_dispatch:
  push:
    branches:
      - main


# Permite ler os arquivos do repositório.
# Não precisa alterar.
permissions:
  contents: read


jobs:
  build:
    name: "Compilar APK"
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # ETAPA 1 — BAIXAR OS ARQUIVOS DO GITHUB
      # Não precisa alterar.
      # O GitHub baixa os arquivos que estão no repositório.
      # ======================================================

      - name: "Baixar arquivos do repositório"
        uses: actions/checkout@v4


      # ======================================================
      # ETAPA 2 — PREPARAR O JAVA
      # Não precisa alterar, desde que o projeto seja compatível
      # com Java 17.
      # ======================================================

      - name: "Configurar Java"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ======================================================
      # ETAPA 3 — PREPARAR O GRADLE
      # Não precisa alterar, desde que a versão seja compatível
      # com o projeto Android.
      # ======================================================

      - name: "Configurar Gradle"
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"


      # ======================================================
      # ETAPA 4 — INFORMAR QUAL É O ARQUIVO ZIP
      #
      # IMPORTANTE:
      # O GitHub não consegue acessar diretamente os arquivos
      # que estão apenas na memória do seu celular.
      #
      # Você precisa enviar o ZIP para dentro do repositório.
      #
      # Na linha ZIP_NAME, escreva o nome EXATO do arquivo ZIP
      # que você enviou para o GitHub.
      #
      # EXEMPLO:
      # Se enviou MeuAplicativo.zip, escreva:
      # ZIP_NAME: "MeuAplicativo.zip"
      #
      # Não coloque o caminho da pasta Downloads do celular.
      # O arquivo precisa estar no repositório do GitHub.
      # ======================================================

      - name: "Preparar arquivo ZIP"
        env:
          ZIP_NAME: "Casa_Administrada.zip"

          # ==================================================
          # ETAPA 5 — INFORMAR O NOME DA PASTA DO PROJETO
          #
          # Abra o ZIP e confira qual pasta contém o projeto
          # Android, incluindo settings.gradle ou
          # settings.gradle.kts.
          #
          # Exemplo:
          # Se encontrar a pasta MeuAplicativo, escreva:
          # PROJECT_FOLDER: "MeuAplicativo"
          #
          # Informe o nome da pasta dentro do ZIP, e não o nome
          # do arquivo ZIP.
          # ==================================================

          PROJECT_FOLDER: "GranaFelizAndroid"

        run: |
          set -euo pipefail

          # Verifica se o arquivo ZIP existe no repositório.
          if [ ! -f "$ZIP_NAME" ]; then
            echo "ERRO: o arquivo ZIP não foi encontrado."
            echo "Confira o nome e se ele foi enviado ao GitHub."
            exit 1
          fi

          # Extrai o ZIP para uma pasta temporária.
          mkdir -p extracted
          unzip -q "$ZIP_NAME" -d extracted

          # Confere se a pasta informada contém um projeto Gradle.
          if [ ! -f "extracted/$PROJECT_FOLDER/settings.gradle" ] && \
             [ ! -f "extracted/$PROJECT_FOLDER/settings.gradle.kts" ]; then
            echo "ERRO: não encontrei o projeto na pasta informada."
            echo "Confira o nome da pasta dentro do ZIP."
            exit 1
          fi

          # Guarda o caminho do projeto para a próxima etapa.
          echo "PROJECT_PATH=extracted/$PROJECT_FOLDER" >> "$GITHUB_ENV"


      # ======================================================
      # ETAPA 6 — COMPILAR O APLICATIVO
      # Não precisa alterar para projetos Android Gradle
      # compatíveis com a configuração acima.
      # ======================================================

      - name: "Compilar APK"
        run: |
          set -euo pipefail
          cd "$PROJECT_PATH"
          gradle --no-daemon assembleDebug


      # ======================================================
      # ETAPA 7 — DISPONIBILIZAR O APK PARA DOWNLOAD
      #
      # O nome APK-ANDROID será exibido na seção Artifacts.
      #
      # O caminho abaixo pressupõe que o módulo Android se
      # chama app e gera um APK de depuração convencional.
      # ======================================================

      - name: "Disponibilizar APK"
        uses: actions/upload-artifact@v4
        with:
          name: "APK-ANDROID"
          path: "extracted/**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 7
